<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USB Serial Protocol</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7f9;
    --panel:#ffffff;
    --ink:#141a26;
    --muted:#5a6577;
    --line:#e3e7ee;
    --line-soft:#eef1f6;
    --accent:#1e5dff;
    --accent-weak:#eaf0ff;
    --start:#e8590c;   /* START / END */
    --cmd:#7048e8;     /* command byte */
    --pay:#1e5dff;     /* payload */
    --chk:#0ca678;     /* checksum */
    --host:#1e5dff;
    --device:#0ca678;
    --warn:#c0392b;
    --radius:14px;
    --mono:'IBM Plex Mono','Noto Sans SC',monospace;
    --sans:'IBM Plex Sans','Noto Sans SC',system-ui,sans-serif;
    --display:'Space Grotesk','Noto Sans SC',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:var(--sans);font-size:15px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  body.lang-zh{line-height:1.75}

  /* ---------- Top bar ---------- */
  header.bar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    gap:16px;padding:14px 22px;
    background:rgba(246,247,249,.85);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex;flex-direction:column;line-height:1.15}
  .brand .eyebrow{
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);font-weight:600;
  }
  .brand .name{font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:-.01em}
  .lang-toggle{
    font-family:var(--mono);font-weight:600;font-size:13px;
    display:inline-flex;align-items:center;gap:8px;
    padding:9px 15px;border:1px solid var(--line);border-radius:999px;
    background:var(--panel);color:var(--ink);cursor:pointer;
    transition:border-color .15s ease, transform .1s ease, box-shadow .15s ease;
  }
  .lang-toggle:hover{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-weak)}
  .lang-toggle:active{transform:translateY(1px)}
  .lang-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .lang-toggle .globe{width:15px;height:15px;opacity:.75}

  /* ---------- Layout ---------- */
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}
  main{display:grid;grid-template-columns:210px 1fr;gap:40px;max-width:1180px;margin:0 auto;padding:0 22px}
  nav.toc{
    position:sticky;top:86px;align-self:start;height:max-content;
    font-size:13.5px;padding-top:36px;
  }
  nav.toc .toc-label{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);margin:0 0 12px 2px;
  }
  nav.toc a{
    display:block;padding:6px 10px;margin:1px 0;border-radius:8px;
    color:var(--muted);text-decoration:none;border-left:2px solid transparent;
    transition:background .12s,color .12s;
  }
  nav.toc a:hover{background:var(--line-soft);color:var(--ink)}
  nav.toc a.active{color:var(--accent);background:var(--accent-weak);border-left-color:var(--accent);font-weight:600}
  .content{min-width:0;padding-bottom:80px}

  /* ---------- Hero ---------- */
  .hero{padding:52px 0 30px}
  .hero h1{
    font-family:var(--display);font-weight:700;font-size:clamp(30px,5vw,46px);
    line-height:1.05;letter-spacing:-.02em;margin:14px 0 16px;
  }
  .hero .kicker{
    font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);font-weight:600;
  }
  .hero p.lede{font-size:17px;color:var(--muted);max-width:64ch;margin:0}
  .facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
  .fact{
    font-family:var(--mono);font-size:12.5px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;padding:9px 13px;
    display:flex;gap:8px;align-items:baseline;
  }
  .fact b{color:var(--ink);font-weight:600}
  .fact span{color:var(--muted)}

  /* ---------- Sections ---------- */
  section{padding-top:48px;scroll-margin-top:80px}
  section h2{
    font-family:var(--display);font-weight:600;font-size:24px;letter-spacing:-.01em;
    margin:0 0 6px;display:flex;align-items:center;gap:12px;
  }
  section h2 .num{
    font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent);
    background:var(--accent-weak);border-radius:7px;padding:3px 9px;
  }
  section .sub{color:var(--muted);margin:0 0 22px;max-width:70ch}
  section h3{font-family:var(--display);font-weight:600;font-size:16px;margin:30px 0 10px}
  p{margin:0 0 14px}

  .panel{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;margin:16px 0;
  }

  /* ---------- Byte strip diagram ---------- */
  .strip{display:flex;flex-wrap:wrap;gap:5px;align-items:stretch;margin:6px 0}
  .seg{
    border-radius:9px;padding:9px 11px;min-width:56px;text-align:center;
    border:1.5px solid;background:var(--panel);
    display:flex;flex-direction:column;gap:3px;justify-content:center;
  }
  .seg .lab{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.02em}
  .seg .sz{font-size:10px;color:var(--muted);font-family:var(--mono)}
  .seg.start,.seg.end{border-color:var(--start);background:#fff5ef}
  .seg.start .lab,.seg.end .lab{color:var(--start)}
  .seg.cmd{border-color:var(--cmd);background:#f4f1fe}
  .seg.cmd .lab{color:var(--cmd)}
  .seg.pay{border-color:var(--pay);background:#eef3ff;flex:1;min-width:120px}
  .seg.pay .lab{color:var(--pay)}
  .seg.field{border-color:var(--pay);background:#eef3ff}
  .seg.field .lab{color:var(--pay)}
  .seg.chk{border-color:var(--chk);background:#e9f8f2}
  .seg.chk .lab{color:var(--chk)}

  .legend{display:flex;flex-wrap:wrap;gap:16px;margin-top:16px;font-size:12.5px;color:var(--muted)}
  .legend span{display:inline-flex;align-items:center;gap:7px;font-family:var(--mono)}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block;border:1.5px solid}
  .dot.start{border-color:var(--start);background:#fff5ef}
  .dot.cmd{border-color:var(--cmd);background:#f4f1fe}
  .dot.pay{border-color:var(--pay);background:#eef3ff}
  .dot.chk{border-color:var(--chk);background:#e9f8f2}

  /* ---------- Tables ---------- */
  table{border-collapse:collapse;width:100%;font-size:13.5px;margin:4px 0}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  th{
    font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;
    color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);
  }
  td.mono,.mono{font-family:var(--mono)}
  td.off{color:var(--muted);font-family:var(--mono);width:52px}
  td.ty{font-family:var(--mono);color:var(--cmd);white-space:nowrap}
  tr:last-child td{border-bottom:none}

  /* ---------- Command cards ---------- */
  .cmd-card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px 20px;margin:14px 0;
  }
  .cmd-head{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:4px}
  .cmd-head .cname{font-family:var(--mono);font-weight:600;font-size:15px}
  .badge{
    font-family:var(--mono);font-size:11.5px;font-weight:600;
    padding:2px 8px;border-radius:6px;white-space:nowrap;
  }
  .badge.hex{background:#f4f1fe;color:var(--cmd)}
  .badge.size{background:var(--line-soft);color:var(--muted)}
  .badge.dir-host{background:#eef3ff;color:var(--host)}
  .badge.dir-device{background:#e9f8f2;color:var(--device)}
  .cmd-desc{color:var(--muted);font-size:13.5px;margin:4px 0 12px}
  .nopayload{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-style:italic}

  /* ---------- Notes ---------- */
  .note{
    display:flex;gap:12px;padding:14px 16px;border-radius:12px;margin:10px 0;
    background:var(--panel);border:1px solid var(--line);
  }
  .note .ic{
    flex:none;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
    font-family:var(--mono);font-weight:700;font-size:12px;color:#fff;background:var(--accent);
  }
  .note.warn{background:#fdf3f2;border-color:#f3d3ce}
  .note.warn .ic{background:var(--warn)}
  .note .body{font-size:13.5px}
  .note .body b{font-weight:600}

  code.inl{
    font-family:var(--mono);font-size:.9em;background:var(--line-soft);
    padding:1px 6px;border-radius:5px;color:var(--ink);
  }
  .hl-start{color:var(--start);font-weight:600}
  .hl-cmd{color:var(--cmd);font-weight:600}
  .hl-pay{color:var(--pay);font-weight:600}
  .hl-chk{color:var(--chk);font-weight:600}

  .example{
    font-family:var(--mono);font-size:13px;background:#0f1420;color:#e7ecf5;
    border-radius:12px;padding:16px 18px;margin:12px 0;overflow-x:auto;line-height:1.9;
  }
  .example .c{color:#7f8aa3}
  .example .b{color:#ffb27a}

  footer{border-top:1px solid var(--line);margin-top:60px;padding:28px 0 50px}
  footer p{color:var(--muted);font-size:12.5px;margin:0;font-family:var(--mono)}

  @media(max-width:860px){
    main{grid-template-columns:1fr;gap:0}
    nav.toc{display:none}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;scroll-behavior:auto!important}
  }
</style>
</head>

</header>

/* ---- Byte-role descriptions used in the anatomy section ---- */
const anatomyRoles = [
  ['start','START','1', k=>k.anatomy_roles_start],
  ['cmd','CMD','1', k=>k.anatomy_roles_cmd],
  ['pay','PAYLOAD','0..N', k=>k.anatomy_roles_pay],
  ['chk','CHK','1', k=>k.anatomy_roles_chk],
  ['end','END','1', k=>k.anatomy_roles_end],
];

/* ============================================================
   Protocol data — language-neutral, with bilingual descriptions.
   off = byte offset within the frame (start=0, cmd=1, payload=2..)
   ============================================================ */

const HOST = [
  { id:'0x00', name:'CMD_BASE', size:9,
    desc:{en:'Base training mode — set concentric and eccentric force targets.',
          zh:'基础训练模式 —— 设置向心与离心力目标。'},
    fields:[
      {off:2,name:'concentric',type:'int16',size:2,d:{en:'Concentric force target (dN).',zh:'向心力目标（dN）。'}},
      {off:4,name:'eccentric',type:'int16',size:2,d:{en:'Eccentric force target (dN).',zh:'离心力目标（dN）。'}},
      {off:6,name:'SSR',type:'uint8',size:1,d:{en:'SSR flag — 0xFF = on, otherwise off.',zh:'SSR 标志 —— 0xFF 为开，其它为关。'}},
    ]},

  { id:'0x01', name:'CMD_ELASTIC', size:8,
    desc:{en:'Elastic mode — length and end force.',zh:'弹性模式 —— 长度与末端力。'},
    fields:[
      {off:2,name:'length',type:'int16',size:2,d:{en:'Elastic length (mm).',zh:'弹性长度（mm）。'}},
      {off:4,name:'endforce',type:'int16',size:2,d:{en:'End force (dN).',zh:'末端力（dN）。'}},
    ]},

  { id:'0x04', name:'CMD_VIBRATIONS', size:8,
    desc:{en:'Superimpose a vibration on the force output.',zh:'在力输出上叠加振动。'},
    fields:[
      {off:2,name:'amplitude',type:'int16',size:2,d:{en:'Vibration amplitude (dN).',zh:'振动幅值（dN）。'}},
      {off:4,name:'frequency',type:'int16',size:2,d:{en:'Vibration frequency (Hz).',zh:'振动频率（Hz）。'}},
    ]},

  { id:'0x0C', name:'CMD_POSITION', size:10,
    desc:{en:'Position-hold mode — move to and hold a target position.',zh:'位置保持模式 —— 移动到目标位置并保持。'},
    fields:[
      {off:2,name:'target',type:'int16',size:2,d:{en:'Target position (mm).',zh:'目标位置（mm）。'}},
      {off:4,name:'speedlimit',type:'int16',size:2,d:{en:'Speed limit (mm/s).',zh:'速度上限（mm/s）。'}},
      {off:6,name:'forcelimit',type:'int16',size:2,d:{en:'Force limit (dN).',zh:'力上限（dN）。'}},
    ]},

  { id:'0x10', name:'CMD_SPEED', size:6,
    desc:{en:'Set the maximum eccentric speed target.',zh:'设置最大离心速度目标。'},
    fields:[
      {off:2,name:'targetspeed',type:'int16',size:2,d:{en:'Target speed (mm/s).',zh:'目标速度（mm/s）。'}},
    ]},

  { id:'0x11', name:'CMD_ISOCINETIC', size:8,
    desc:{en:'Isokinetic mode — constant-speed target with a force slope.',zh:'等速模式 —— 恒速目标加力斜率。'},
    fields:[
      {off:2,name:'speed',type:'int16',size:2,d:{en:'Speed target (mm/s), signed.',zh:'速度目标（mm/s），有符号。'}},
      {off:4,name:'slope',type:'int16',size:2,d:{en:'Force slope (dN per mm/s).',zh:'力斜率（dN / (mm/s)）。'}},
    ]},

  { id:'0x12', name:'CMD_ZERO', size:5,
    desc:{en:'Set / capture the zero (limit) position.',zh:'设置 / 捕获零点（限位）位置。'},
    fields:[
      {off:2,name:'set0position',type:'uint8',size:1,d:{en:'0xFF = capture the current position as zero.',zh:'0xFF = 将当前位置捕获为零点。'}},
    ]},

  { id:'0x14', name:'CMD_BAND', size:11,
    desc:{en:'Resistance-band mode — rest length, max length, end force and a coefficient.',
          zh:'弹力带模式 —— 松弛长度、最大长度、末端力与系数。'},
    fields:[
      {off:2,name:'rest',type:'int16',size:2,d:{en:'Rest length (mm).',zh:'松弛长度（mm）。'}},
      {off:4,name:'maxlength',type:'int16',size:2,d:{en:'Maximum length (mm).',zh:'最大长度（mm）。'}},
      {off:6,name:'endforce',type:'int16',size:2,d:{en:'End force (dN).',zh:'末端力（dN）。'}},
      {off:8,name:'coef',type:'uint8',size:1,d:{en:'Curve coefficient (0–4).',zh:'曲线系数（0–4）。'}},
    ]},

  { id:'0x15', name:'CMD_INERTIA', size:6,
    desc:{en:'Inertia mode — starting force.',zh:'惯量模式 —— 起始力。'},
    fields:[
      {off:2,name:'inertia',type:'int16',size:2,d:{en:'Starting force (dN).',zh:'起始力（dN）。'}},
    ]},

  { id:'0x0E', name:'CMD_FEEDBACK', size:4, request:true, resp:'FeedBackFrame',
    desc:{en:'Request a standard feedback frame. No payload — the device replies with FeedBackFrame.',
          zh:'请求一个标准反馈帧。无载荷 —— 设备回复 FeedBackFrame。'},
    fields:[]},
];

const FEEDBACK = [
  { name:'FeedBackFrame', size:21, trig:'CMD_FEEDBACK (0x0E)',
    desc:{en:'Standard telemetry snapshot.',zh:'标准遥测快照。'},
    fields:[
      {off:2,name:'state',type:'uint8',size:1,d:{en:'Device state (see States).',zh:'设备状态（见状态表）。'}},
      {off:3,name:'length',type:'int32',size:4,d:{en:'Position (mm).',zh:'位置（mm）。'}},
      {off:7,name:'speed',type:'int16',size:2,d:{en:'Speed (mm/s).',zh:'速度（mm/s）。'}},
      {off:9,name:'force',type:'int16',size:2,d:{en:'Total force (dN).',zh:'总力（dN）。'}},
      {off:11,name:'FETtemperature',type:'int16',size:2,d:{en:'FET temperature (°C).',zh:'FET 温度（°C）。'}},
      {off:13,name:'MotorTemperature',type:'int16',size:2,d:{en:'Motor temperature (°C).',zh:'电机温度（°C）。'}},
      {off:15,name:'BRTemperature',type:'int16',size:2,d:{en:'Brake-resistor temperature (°C).',zh:'制动电阻温度（°C）。'}},
      {off:17,name:'BusVoltage',type:'int16',size:2,d:{en:'Bus voltage (V).',zh:'母线电压（V）。'}},
    ]},
];

/* ============================================================
   Rendering
   ============================================================ */
let lang = 'en';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function stripFor(fields, includePayloadMerged){
  // Build a colour-coded byte strip for a frame.
  let segs = `<div class="seg start"><span class="lab">START</span><span class="sz">0x02</span></div>`;
  segs += `<div class="seg cmd"><span class="lab">CMD</span><span class="sz">1</span></div>`;
  if(fields.length === 0){
    // request frame, no payload
  } else if(includePayloadMerged){
    segs += `<div class="seg pay"><span class="lab">PAYLOAD</span><span class="sz">0..N B</span></div>`;
  } else {
    fields.forEach(f=>{
      segs += `<div class="seg field"><span class="lab">${esc(f.name)}</span><span class="sz">${f.size} B</span></div>`;
    });
  }
  segs += `<div class="seg chk"><span class="lab">CHK</span><span class="sz">1</span></div>`;
  segs += `<div class="seg end"><span class="lab">END</span><span class="sz">0x03</span></div>`;
  return `<div class="strip">${segs}</div>`;
}

function fieldTable(fields){
  const c = T[lang].col;
  if(fields.length===0) return `<div class="nopayload">— ${lang==='en'?'no payload':'无载荷'} —</div>`;
  let rows = fields.map(f=>`<tr>
      <td class="off">${f.off}</td>
      <td class="mono">${esc(f.name)}</td>
      <td class="ty">${f.type}</td>
      <td class="off">${f.size}</td>
      <td>${esc(f.d[lang])}</td>
    </tr>`).join('');
  return `<table>
    <thead><tr><th>${c.off}</th><th>${c.field}</th><th>${c.type}</th><th>${c.size}</th><th>${c.desc}</th></tr></thead>
    <tbody>${rows}</tbody></table>`;
}

function cmdCard(cmd, dir){
  const t = T[lang];
  const dirBadge = dir==='host'
    ? `<span class="badge dir-host">${lang==='en'?'Host → Device':'主机 → 设备'}</span>`
    : `<span class="badge dir-device">${lang==='en'?'Device → Host':'设备 → 主机'}</span>`;
  const hex = cmd.id ? `<span class="badge hex">${cmd.id}</span>` : '';
  const sizeBadge = `<span class="badge size">${cmd.size} ${lang==='en'?'bytes':'字节'}</span>`;
  const resp = cmd.resp ? `<span class="badge dir-device">→ ${cmd.resp}</span>` : '';
  const trig = cmd.trig ? `<span class="badge hex">${t.feedback_trigger} ${cmd.trig}</span>` : '';
  return `<div class="cmd-card">
    <div class="cmd-head">
      <span class="cname">${esc(cmd.name)}</span>${hex}${sizeBadge}${dirBadge}${resp}${trig}
    </div>
    <div class="cmd-desc">${cmd.desc[lang]}</div>
    ${stripFor(cmd.fields, false)}
    ${fieldTable(cmd.fields)}
  </div>`;
}

function render(){
  const t = T[lang];
  document.documentElement.lang = (lang==='zh')?'zh-CN':'en';
  document.title = t.docTitle;
  document.body.className = (lang==='zh')?'lang-zh':'lang-en';
  document.getElementById('langLabel').textContent = t.langLabel;
  document.querySelector('[data-k="eyebrow"]').textContent = t.eyebrow;
  document.querySelector('[data-k="brand"]').textContent = t.brand;

  // TOC
  const S = t.sections;
  const tocItems = [
    ['transport',S.transport],['anatomy',S.anatomy],['checksum',S.checksum],
    ['host',S.host],['feedback',S.feedback],['enums',S.enums],['notes',S.notes],
  ];
  document.getElementById('toc').innerHTML =
    `<div class="toc-label">${t.toc}</div>` +
    tocItems.map(([id,label])=>`<a href="#${id}">${label}</a>`).join('');

  // Anatomy roles
  const rolesHtml = anatomyRoles.map(([cls,lab,sz,fn])=>`
    <tr>
      <td><span class="hl-${cls==='start'||cls==='end'?'start':cls}">${lab}</span></td>
      <td class="off">${sz}</td>
      <td>${fn(t)}</td>
    </tr>`).join('');

  // Facts
  const factsHtml = t.facts.map(([a,b])=>`<div class="fact"><b>${a}</b><span>${b}</span></div>`).join('');

  // Host commands
  const hostHtml = HOST.map(c=>cmdCard(c,'host')).join('');
  // Feedback frames
  const fbHtml = FEEDBACK.map(f=>cmdCard(f,'device')).join('');

  // States + units
  const statesHtml = t.states.map(s=>`<li>${s}</li>`).join('');
  const unitsHtml = t.units.map(([a,b])=>`<tr><td class="mono">${a}</td><td>${b}</td></tr>`).join('');

  // Notes
  const notesHtml = t.notes.map(([kind,title,body])=>`
    <div class="note ${kind==='warn'?'warn':''}">
      <span class="ic">${kind==='warn'?'!':'i'}</span>
      <div class="body"><b>${title}</b><br>${body}</div>
    </div>`).join('');

  document.getElementById('content').innerHTML = `
    <section class="hero" style="scroll-margin-top:0">
      <span class="kicker">${t.hero_kicker}</span>
      <h1>${t.hero_title}</h1>
      <p class="lede">${t.hero_lede}</p>
      <div class="facts">${factsHtml}</div>
    </section>

    <section id="transport">
      <h2><span class="num">01</span>${S.transport}</h2>
      <p>${t.transport_p1}</p>
      <p>${t.transport_p2}</p>
      <div class="note"><span class="ic">i</span><div class="body">${t.transport_note}</div></div>
    </section>

    <section id="anatomy">
      <h2><span class="num">02</span>${S.anatomy}</h2>
      <p class="sub">${t.anatomy_p}</p>
      <div class="panel">
        ${stripFor([{name:'payload',size:'N'}], true)}
        <div class="legend">
          <span><i class="dot start"></i>${t.legend.start}</span>
          <span><i class="dot cmd"></i>${t.legend.cmd}</span>
          <span><i class="dot pay"></i>${t.legend.pay}</span>
          <span><i class="dot chk"></i>${t.legend.chk}</span>
        </div>
      </div>
      <table>
        <thead><tr><th>${t.col.field}</th><th>${t.col.size}</th><th>${t.col.desc}</th></tr></thead>
        <tbody>${rolesHtml}</tbody>
      </table>
    </section>

    <section id="checksum">
      <h2><span class="num">03</span>${S.checksum}</h2>
      <p>${t.checksum_p}</p>
      <div class="example"><span class="c"># ${lang==='en'?'algorithm':'算法'}</span><br>${t.checksum_algo}</div>
      <p>${t.checksum_steps}</p>
      <h3>${t.checksum_ex_title}</h3>
      <div class="example">
<span class="c"># ${lang==='en'?'frame':'帧'}</span>  <span class="hl-start">02</span> <span class="hl-cmd">12</span> <span class="hl-pay">FF</span> <span class="hl-chk">ED</span> <span class="hl-start">03</span><br>
<span class="c"># ${lang==='en'?'checksum = CMD ⊕ payload':'校验和 = CMD ⊕ 载荷'}</span><br>
<span class="hl-chk">0xED</span> = <span class="hl-cmd">0x12</span> ⊕ <span class="hl-pay">0xFF</span>
      </div>
    </section>

    <section id="host">
      <h2><span class="num">04</span>${S.host}</h2>
      <p class="sub">${t.host_p}</p>
      ${hostHtml}
    </section>

    <section id="feedback">
      <h2><span class="num">05</span>${S.feedback}</h2>
      <p class="sub">${t.feedback_p}</p>
      ${fbHtml}
    </section>

    <section id="enums">
      <h2><span class="num">06</span>${S.enums}</h2>
      <p class="sub">${t.enums_p}</p>
      <div class="panel"><ul style="margin:0;padding-left:20px">${statesHtml}</ul></div>
      <h3>${t.units_title}</h3>
      <table><tbody>${unitsHtml}</tbody></table>
    </section>

    <section id="notes">
      <h2><span class="num">07</span>${S.notes}</h2>
      ${notesHtml}
    </section>

    <footer><p>${t.footer}</p></footer>
  `;

  setupScrollSpy();
}

/* Scroll spy for the TOC */
let spyObserver;
function setupScrollSpy(){
  if(spyObserver) spyObserver.disconnect();
  const links = [...document.querySelectorAll('nav.toc a')];
  const map = {};
  links.forEach(a=>map[a.getAttribute('href').slice(1)]=a);
  spyObserver = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        links.forEach(l=>l.classList.remove('active'));
        const a = map[e.target.id];
        if(a) a.classList.add('active');
      }
    });
  },{rootMargin:'-20% 0px -70% 0px'});
  ['transport','anatomy','checksum','host','feedback','enums','notes']
    .forEach(id=>{const el=document.getElementById(id); if(el) spyObserver.observe(el);});
}

document.getElementById('langBtn').addEventListener('click',()=>{
  lang = (lang==='en')?'zh':'en';
  render();
});

render();
</script>
